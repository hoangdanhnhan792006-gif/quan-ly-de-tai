<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Đánh giá và chấm điểm · Quản lý đề tài</title>
</head>
<body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace">
<header class="page-header">
    <div><h1>Đánh giá và chấm điểm</h1><p>Phản biện, chấm hội đồng, tổng hợp và công bố kết quả theo từng đề tài.</p></div>
    <div class="actions" th:if="${laCanBoKhoa}"><a class="button" th:href="@{/khoa/danh-gia/tao}">Lập kế hoạch đánh giá</a><a class="button secondary" th:href="@{/khoa/hoi-dong}">Quản lý hội đồng</a></div>
</header>
<p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p><p class="message error" th:if="${loi}" th:text="${loi}"></p>
<div class="table-wrap"><table><thead><tr><th>Nhóm / Đề tài</th><th>Đợt</th><th>Phản biện</th><th>Hội đồng</th></tr></thead><tbody>
<tr th:each="d : ${danhSach}"><td><span class="mono muted" th:text="${d.maNhom}"></span><br><a class="row-title" th:href="@{/danh-gia/{id}(id=${d.id})}" th:text="${d.tenDeTai}"></a></td>
<td th:text="${d.tenDot}"></td><td><span th:replace="~{fragments/nhan :: badge-trang-thai(${d.phanBien})}"></span></td><td><span th:replace="~{fragments/nhan :: badge-trang-thai(${d.hoiDong})}"></span></td></tr>
<tr th:if="${#lists.isEmpty(danhSach)}"><td class="empty" colspan="4">Chưa có đánh giá thuộc quyền của bạn.</td></tr></tbody></table></div>
</main></body></html>
