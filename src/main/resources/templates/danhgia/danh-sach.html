<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Quản lý đề tài sinh viên</title>
</head><body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace"><p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p><p class="message error" th:if="${loi}" th:text="${loi}"></p>

<h1>Đánh giá và chấm điểm</h1>
<div class="actions" th:if="${laCanBoKhoa}"><a class="button" th:href="@{/khoa/danh-gia/tao}">Lập kế hoạch đánh giá</a><a th:href="@{/khoa/hoi-dong}">Quản lý hội đồng</a></div>
<table><thead><tr><th>Nhóm / Đề tài</th><th>Đợt</th><th>Phản biện</th><th>Hội đồng</th></tr></thead><tbody>
<tr th:each="d : ${danhSach}"><td><span th:text="${d.maNhom}"></span><br><a th:href="@{/danh-gia/{id}(id=${d.id})}" th:text="${d.tenDeTai}"></a></td>
<td th:text="${d.tenDot}"></td><td th:text="${d.phanBien.nhan}"></td><td th:text="${d.hoiDong.nhan}"></td></tr>
<tr th:if="${#lists.isEmpty(danhSach)}"><td colspan="4">Chưa có đánh giá thuộc quyền của bạn.</td></tr></tbody></table>
</main></body></html>
