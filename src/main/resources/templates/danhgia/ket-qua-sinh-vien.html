<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Quản lý đề tài sinh viên</title>
</head><body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace"><p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p><p class="message error" th:if="${loi}" th:text="${loi}"></p>

<h1>Kết quả đề tài của tôi</h1>
<form method="get" th:action="@{/sinh-vien/ket-qua}">
<label for="dotId">Đợt đăng ký</label><select id="dotId" name="dotId">
<option value="">Tất cả đợt của tôi</option>
<option th:each="d : ${cacDot}" th:value="${d.key}" th:text="${d.value}" th:selected="${d.key == dotId}"></option>
</select><button type="submit">Tra cứu</button></form>
<section class="panel" th:each="d : ${danhSach}">
<h2 th:text="${d.tenDeTai}"></h2><p>Đợt: <strong th:text="${d.tenDot}"></strong></p><p th:text="${d.maNhom}"></p><p th:if="${d.ketQua==null}">Khoa chưa công bố kết quả.</p>
<div th:if="${d.ketQua!=null}" th:with="k=${d.ketQua}">
<p>Phiên bản công bố: <span th:text="${k.phienBan}"></span></p><p><strong th:text="${k.diemCuoi}"></strong> / 10 — <strong th:text="${k.dat?'Đạt':'Không đạt'}"></strong></p>
<p class="message" th:if="${k.dangDieuChinh}">Đang điều chỉnh. Điểm hiển thị là kết quả đã công bố; kết quả mới chỉ thay thế khi khoa công bố lại.</p>
<p class="multiline" th:text="${k.nhanXet}"></p>
<table><thead><tr><th>Giảng viên</th><th>Điểm</th><th>Nhận xét trong kết quả công bố</th></tr></thead>
<tbody><tr th:each="p : ${k.diems}"><td th:text="${p.giangVien}"></td><td th:text="${p.diem}"></td><td class="multiline" th:text="${p.nhanXet}"></td></tr></tbody></table>
</div></section><p th:if="${#lists.isEmpty(danhSach)}">Bạn chưa có đăng ký đề tài được chấp thuận.</p>
</main></body></html>
