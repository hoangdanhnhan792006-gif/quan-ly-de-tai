<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Kế hoạch đánh giá · Quản lý đề tài</title>
</head>
<body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace">
<a class="back-link" th:href="@{/danh-gia}">← Đánh giá</a>
<h1 th:text="${id==null} ? 'Lập kế hoạch phản biện và hội đồng' : 'Sửa kế hoạch phản biện và hội đồng'">Kế hoạch phản biện và hội đồng</h1>
<p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p><p class="message error" th:if="${loi}" th:text="${loi}"></p>
<!--/* Ô ngày giờ nhập giờ Việt Nam; backend đổi UTC khi lưu. Không dùng JS ẩn/khóa ô theo loại đợt. */-->
<form class="panel stack" th:object="${form}" th:action="${id==null}?@{/khoa/danh-gia/tao}:@{/khoa/danh-gia/{id}/sua(id=${id})}" method="post">
<div class="message error" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<fieldset><legend>Phản biện</legend>
<div class="form-grid">
<div class="field"><label for="dangKyId">Nhóm / Đề tài đã chấp thuận<span class="req">*</span></label><select th:field="*{dangKyId}" required><option value="">Chọn đăng ký</option>
<option th:each="d : ${dangKys}" th:value="${d.dangKyId}" th:text="${d.maNhom+' — '+d.tenDeTai}"></option></select></div>
<div class="field"><label for="phanBienId">Giảng viên phản biện (khác GVHD)<span class="req">*</span></label><select th:field="*{phanBienId}" required><option value="">Chọn GV</option>
<option th:each="g : ${giangViens}" th:value="${g.id}" th:text="${g.maGv+' — '+g.hoTen}"></option></select></div>
<div class="field"><label for="lichPhanBienLuc">Lịch phản biện<span class="req">*</span></label><input type="datetime-local" th:field="*{lichPhanBienLuc}" required><p class="field-hint">Giờ Việt Nam, từ hạn báo cáo trở đi.</p></div>
<div class="field"><label for="diaDiemPhanBien">Địa điểm phản biện<span class="req">*</span></label><input th:field="*{diaDiemPhanBien}" maxlength="255" required></div>
</div></fieldset>
<fieldset><legend>Hội đồng (chỉ NCKH/KLTN)</legend>
<p class="field-hint">Môn học/TLCN để trống các mục dưới. KLTN chọn đúng ngày hội đồng của đợt.</p>
<div class="field"><label for="hoiDongId">Hội đồng đã chốt, cùng đợt</label><select th:field="*{hoiDongId}"><option value="">Không có hội đồng</option>
<option th:each="h : ${hoiDongs}" th:value="${h.id}" th:text="${h.tenDot+' — '+h.tenHoiDong+' ('+h.trangThai.nhan+')'}"></option></select></div>
<div class="form-grid">
<div class="field"><label for="hoiDongBatDau">Giờ bắt đầu hội đồng</label><input type="datetime-local" th:field="*{hoiDongBatDau}"></div>
<div class="field"><label for="hoiDongKetThuc">Giờ kết thúc hội đồng</label><input type="datetime-local" th:field="*{hoiDongKetThuc}"></div>
</div>
<div class="field"><label for="diaDiemHoiDong">Địa điểm hội đồng</label><input th:field="*{diaDiemHoiDong}" maxlength="255"></div>
</fieldset>
<div class="actions"><button class="button">Lưu kế hoạch</button><a class="button secondary" th:href="@{/danh-gia}">Hủy</a></div></form>
</main></body></html>
