<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Chọn đề tài · Quản lý đề tài</title>
</head>
<body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav><main class="workspace">
<a class="back-link" th:href="@{/sinh-vien/nhom/{id}(id=${nhom.id})}">← Chi tiết nhóm</a>
<header class="page-header">
    <div>
        <p class="eyebrow" th:text="${nhom.tenDot}">Đợt</p>
        <h1>Chọn đề tài cho nhóm <span class="mono" th:text="${nhom.maNhom}"></span></h1>
    </div>
</header>
<p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p>
<p class="message error" th:if="${loi}" th:text="${loi}"></p>
<p class="message info">Gửi đăng ký thành công sẽ giữ chỗ trong lúc chờ khoa duyệt. Nếu đổi sang đề tài đã hết chỗ, đăng ký cũ được giữ nguyên.</p>
<form th:action="@{/sinh-vien/dang-ky/{id}(id=${nhom.id})}" method="post" th:object="${form}" class="panel stack">
<div class="message error" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div class="field">
<label for="deTaiId">Đề tài đã công bố<span class="req">*</span></label><select th:field="*{deTaiId}" required>
<option value="">Chọn đề tài</option><option th:each="d : ${deTais}" th:value="${d.id}" th:disabled="${d.daGiuCho}"
th:text="${d.maDeTai + ' — ' + d.tenDeTai + (d.daGiuCho ? ' (Đã có nhóm giữ chỗ)' : '')}"></option></select>
</div>
<button th:disabled="${#lists.isEmpty(deTais)}">Gửi đăng ký / Đổi đề tài</button></form>
<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Đề tài</th><th>Tình trạng</th></tr></thead><tbody>
<tr th:each="d : ${deTais}"><td class="mono" th:text="${d.maDeTai}"></td><td><a class="row-title" th:href="@{/de-tai/{id}(id=${d.id})}" th:text="${d.tenDeTai}"></a></td>
<td><span class="badge" th:classappend="${d.daGiuCho} ? 'warning' : 'success'" th:text="${d.daGiuCho ? 'Nhóm khác đang giữ chỗ' : 'Có thể chọn'}"></span></td></tr>
<tr th:if="${#lists.isEmpty(deTais)}"><td class="empty" colspan="3">Chưa có đề tài công bố trong đợt này.</td></tr></tbody></table></div>
</main></body></html>
