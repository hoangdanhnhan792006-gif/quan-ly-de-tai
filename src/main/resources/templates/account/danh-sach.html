<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Quản lý tài khoản · Quản lý đề tài</title>
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <h1>Quản lý tài khoản</h1>
            <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
            </p>
            <a class="button" th:href="@{/admin/tai-khoan/tao}">Tạo tài khoản</a>
            <p class="message error" th:if="${loi}" th:text="${loi}"></p>
            <p>Chỉ xóa tài khoản chưa có hồ sơ và dữ liệu liên quan. Tài khoản đã sử dụng nên được khóa.</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tên đăng nhập</th>
                            <th>Họ tên / Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tk : ${danhSach}">
                            <td th:text="${tk.tenDangNhap}">
                            </td>
                            <td>
                                <strong th:text="${tk.hoTen}">
                                </strong>
                                <br>
                                <span th:text="${tk.email}">
                                </span>
                            </td>
                            <td th:text="${tk.vaiTros}">
                            </td>
                            <td th:text="${tk.trangThai}">
                            </td>
                            <td>
                                <a th:href="@{/admin/tai-khoan/{id}/sua(id=${tk.id})}">Sửa</a>
                                <a th:if="${tk.tenDangNhap != tenDangNhapHienTai}"
                                   th:href="@{/admin/tai-khoan/{id}/dat-lai-mat-khau(id=${tk.id})}">Đặt lại mật khẩu</a>
                                <form th:action="@{/admin/tai-khoan/{id}/trang-thai(id=${tk.id})}" method="post">
                                    <input type="hidden" name="trangThai" th:value="${tk.trangThai.name() == 'HOAT_DONG' ? 'BI_KHOA' : 'HOAT_DONG'}">
                                    <button class="button secondary" type="submit" th:text="${tk.trangThai.name() == 'HOAT_DONG' ? 'Khóa' : 'Mở khóa'}">
                                    </button>
                                </form>
                                <form th:if="${tk.tenDangNhap != tenDangNhapHienTai}"
                                      th:action="@{/admin/tai-khoan/{id}/xoa(id=${tk.id})}" method="post"
                                      onsubmit="return confirm('Xóa vĩnh viễn tài khoản này? Chỉ tài khoản chưa có dữ liệu liên quan mới xóa được.');">
                                    <button class="button secondary" type="submit">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSach)}">
                            <td colspan="5">Chưa có tài khoản.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
