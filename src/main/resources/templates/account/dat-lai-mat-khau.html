<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Đặt lại mật khẩu · Quản lý đề tài</title>
</head>
<body>
<nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace">
    <h1>Đặt lại mật khẩu</h1>
    <a th:href="@{/admin/tai-khoan}">← Danh sách tài khoản</a>
    <p>Tài khoản: <strong th:text="${taiKhoan.tenDangNhap}"></strong></p>
    <p>Admin đặt mật khẩu mới khi người dùng quên mật khẩu. Các phiên cũ sẽ kết thúc khi truy cập tiếp.</p>
    <form class="panel" th:action="@{/admin/tai-khoan/{id}/dat-lai-mat-khau(id=${taiKhoan.id})}"
          th:object="${form}" method="post">
        <div class="message error" th:if="${#fields.hasAnyErrors()}">
            <ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul>
        </div>
        <label for="matKhauMoi">Mật khẩu mới</label>
        <input id="matKhauMoi" name="matKhauMoi" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        <label for="xacNhanMatKhau">Nhập lại mật khẩu mới</label>
        <input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
        <p>Tối thiểu 8 ký tự, tối đa 72 byte UTF-8; mật khẩu mới phải khác mật khẩu hiện tại.</p>
        <button class="button" type="submit">Đặt lại mật khẩu</button>
    </form>
</main>
</body>
</html>
