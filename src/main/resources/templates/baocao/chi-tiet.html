<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Quản lý đề tài sinh viên</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav>
<main class="workspace"><p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p><p class="message error" th:if="${loi}" th:text="${loi}"></p>

<a th:href="@{/bao-cao}">← Báo cáo</a><h1 th:text="${hoSo.tenDeTai}"></h1>
<p>Nhóm: <strong th:text="${hoSo.maNhom}"></strong> · Hạn nộp: <span th:text="${#temporals.format(hoSo.hanNop,'dd/MM/yyyy HH:mm')}"></span> (giờ Việt Nam)</p>
<form class="panel" th:if="${hoSo.coTheNop}" th:action="@{/bao-cao/dang-ky/{id}/nop(id=${hoSo.dangKyId})}" method="post" enctype="multipart/form-data" th:object="${form}">
<h2>Nộp phiên bản mới</h2>
<div class="message error" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<p>Mỗi tệp tối đa 50 MB; ZIP giải nén tối đa 200 MB. Chọn lại đủ 3 tệp khi nộp lại.</p>
<label for="pdf">Báo cáo PDF *</label><input id="pdf" type="file" name="pdf" accept=".pdf" required>
<label for="slide">Slide PDF hoặc PPTX *</label><input id="slide" type="file" name="slide" accept=".pdf,.pptx" required>
<label for="source">Mã nguồn ZIP *</label><input id="source" type="file" name="source" accept=".zip" required>
<label for="ghiChu">Ghi chú</label><textarea th:field="*{ghiChu}" maxlength="5000"></textarea><button class="button">Nộp đủ bộ báo cáo</button>
</form>
<p th:unless="${hoSo.coTheNop}">Chỉ nhóm trưởng được nộp khi đăng ký đã chấp thuận, đợt còn triển khai và chưa hết hạn báo cáo.</p>
<section class="panel" th:each="b : ${hoSo.baoCaos}">
<h2 th:text="${'Phiên bản ' + b.phienBan}"></h2><p th:text="${#temporals.format(b.nopLuc,'dd/MM/yyyy HH:mm:ss')}"></p><p class="multiline" th:text="${b.ghiChu}"></p>
<ul><li th:each="t : ${b.teps}"><span th:text="${t.loai}"></span>: <a th:href="@{/bao-cao/tep/{id}(id=${t.id})}" th:text="${t.ten}"></a> (<span th:text="${t.kichThuoc}"></span> byte)</li></ul>
</section><p th:if="${#lists.isEmpty(hoSo.baoCaos)}">Chưa nộp báo cáo.</p>
</main></body></html>
