<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Kết quả đề tài</title></head>
<body style="font-family:Arial,sans-serif;background:#f5f7fa;padding:24px;color:#253047">
<div style="max-width:560px;margin:auto;background:white;padding:24px;border:1px solid #dce2ea;border-radius:8px">
    <h2 style="color:#156082">Khoa CNTT công bố kết quả đề tài</h2>
    <p>Kết quả đề tài bạn tham gia đã được công bố hoặc cập nhật.</p>
    <p><strong>Đề tài:</strong> <span th:text="${thongBao.tenDeTai}"></span></p>
    <p><strong>Đợt:</strong> <span th:text="${thongBao.tenDot}"></span></p>
    <p><strong>Phiên bản công bố:</strong> <span th:text="${thongBao.phienBan}"></span></p>
    <p><a th:href="${lienKet}" style="color:#156082">Đăng nhập để xem điểm và nhận xét</a></p>
    <p style="font-size:12px;color:#68748a">Thông báo tự động từ Hệ thống Quản lý Đề tài Sinh viên.</p>
</div>
</body></html>
