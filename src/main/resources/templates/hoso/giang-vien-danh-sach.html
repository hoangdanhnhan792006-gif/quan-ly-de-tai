<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(~{::title})}">
        <title>Quản lý giảng viên · Quản lý đề tài</title>
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <header class="page-header">
                <div>
                    <h1>Quản lý giảng viên</h1>
                    <p>Mỗi hồ sơ gắn với một tài khoản có vai trò giảng viên và đúng một bộ môn. Chỉ xóa hồ sơ chưa được sử dụng.</p>
                </div>
                <a class="button" th:href="@{/admin/giang-vien/tao}">Thêm hồ sơ</a>
            </header>
            <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
            </p>
            <p class="message error" th:if="${loi}" th:text="${loi}"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Họ tên</th>
                            <th>Tài khoản</th>
                            <th>Bộ môn</th>
                            <th>Học vị</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${danhSach}">
                            <td class="mono" th:text="${s.maGv}">
                            </td>
                            <td th:text="${s.hoTen}">
                            </td>
                            <td class="mono" th:text="${s.tenDangNhap}">
                            </td>
                            <td th:text="${s.tenBoMon}">
                            </td>
                            <td th:text="${s.hocVi}">
                            </td>
                            <td>
                                <a class="button secondary" th:href="@{/admin/giang-vien/{id}/sua(id=${s.id})}">Sửa</a>
                                <form th:action="@{/admin/giang-vien/{id}/xoa(id=${s.id})}" method="post" onsubmit="return confirm('Xóa bản ghi chưa được sử dụng?')"><button type="submit" class="button danger">Xóa</button></form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSach)}">
                            <td class="empty" colspan="6">Chưa có hồ sơ.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
