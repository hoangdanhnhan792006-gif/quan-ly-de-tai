<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(~{::title})}">
        <title>Hồ sơ của tôi · Quản lý đề tài</title>
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Hồ sơ của tôi</p>
                    <h1 th:text="${hoSo.taiKhoan.hoTen}">Họ tên</h1>
                </div>
                <a class="button secondary" th:href="@{/ho-so/doi-mat-khau}">Đổi mật khẩu</a>
            </header>
            <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
            </p>
            <section class="panel">
                <h2>Tài khoản</h2>
                <dl>
                    <dt>Tên đăng nhập</dt>
                    <dd class="mono" th:text="${hoSo.taiKhoan.tenDangNhap}">
                    </dd>
                    <dt>Họ tên</dt>
                    <dd th:text="${hoSo.taiKhoan.hoTen}">
                    </dd>
                    <dt>Email</dt>
                    <dd th:text="${hoSo.taiKhoan.email}">
                    </dd>
                    <dt>Vai trò</dt>
                    <dd class="badge-list"><th:block th:each="v : ${hoSo.taiKhoan.vaiTros}"><span class="badge info" th:insert="~{fragments/nhan :: vai-tro(${v})}">Vai trò</span></th:block></dd>
                </dl>
                <p class="muted">Liên hệ quản trị viên nếu thông tin hồ sơ cần điều chỉnh.</p>
            </section>
            <section class="panel" th:if="${hoSo.sinhVien != null}">
                <h2>Thông tin sinh viên</h2>
                <dl>
                    <dt>Mã sinh viên</dt>
                    <dd class="mono" th:text="${hoSo.sinhVien.maSv}">
                    </dd>
                    <dt>Lớp</dt>
                    <dd th:text="${hoSo.sinhVien.lop}">
                    </dd>
                    <dt>Khóa học</dt>
                    <dd th:text="${hoSo.sinhVien.khoaHoc}">
                    </dd>
                </dl>
            </section>
            <section class="panel" th:if="${hoSo.giangVien != null}">
                <h2>Thông tin giảng viên</h2>
                <dl>
                    <dt>Mã giảng viên</dt>
                    <dd class="mono" th:text="${hoSo.giangVien.maGv}">
                    </dd>
                    <dt>Bộ môn</dt>
                    <dd th:text="${hoSo.giangVien.tenBoMon}">
                    </dd>
                    <dt>Học vị</dt>
                    <dd th:text="${hoSo.giangVien.hocVi}">
                    </dd>
                </dl>
            </section>
        </main>
    </body>
</html>
