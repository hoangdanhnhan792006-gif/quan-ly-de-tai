<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(~{::title})}">
        <title>Quản lý bộ môn · Quản lý đề tài</title>
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <header class="page-header">
                <div>
                    <h1>Quản lý bộ môn</h1>
                    <p>Chỉ xóa bộ môn chưa được sử dụng. Bộ môn đã có dữ liệu nên chuyển sang ngừng hoạt động.</p>
                </div>
                <a class="button" th:href="@{/admin/bo-mon/tao}">Thêm bộ môn</a>
            </header>
            <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
            </p>
            <p class="message error" th:if="${loi}" th:text="${loi}"></p>
            <div class="table-wrap">
                <table class="management-table">
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Tên bộ môn</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${danhSach}">
                            <td class="mono" th:text="${b.maBoMon}">
                            </td>
                            <td th:text="${b.tenBoMon}">
                            </td>
                            <td>
                                <span class="badge" th:classappend="${b.dangHoatDong} ? 'success' : 'neutral'" th:text="${b.dangHoatDong ? 'Hoạt động' : 'Ngừng hoạt động'}"></span>
                            </td>
                            <td>
                                <div class="table-actions">
                                    <a class="button secondary" th:href="@{/admin/bo-mon/{id}/sua(id=${b.id})}">Sửa</a>
                                    <form th:action="@{/admin/bo-mon/{id}/xoa(id=${b.id})}" method="post" onsubmit="return confirm('Xóa bản ghi chưa được sử dụng?')"><button type="submit" class="button danger">Xóa</button></form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(danhSach)}">
                            <td class="empty" colspan="4">Chưa có bộ môn.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
