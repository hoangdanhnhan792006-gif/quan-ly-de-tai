<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(~{::title})}">
        <title>Hồ sơ sinh viên · Quản lý đề tài</title>
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <a class="back-link" th:href="@{/admin/sinh-vien}">← Danh sách sinh viên</a>
            <h1 th:text="${id != null} ? 'Sửa hồ sơ sinh viên' : 'Thêm hồ sơ sinh viên'">Hồ sơ sinh viên</h1>
            <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
            </p>
            <form class="panel stack" th:action="${id != null} ? @{/admin/sinh-vien/{id}/sua(id=${id})} : @{/admin/sinh-vien/tao}" th:object="${form}" method="post">
                <div class="message error" th:if="${#fields.hasAnyErrors()}">
                    <ul>
                        <li th:each="e : ${#fields.allErrors()}" th:text="${e}">
                        </li>
                    </ul>
                </div>
                <p class="message info">Tạo tài khoản với vai trò tương ứng trước khi thêm hồ sơ. Tài khoản gắn với hồ sơ không được thay đổi sau khi tạo.</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="taiKhoanId">Tài khoản<span class="req">*</span></label>
                        <select id="taiKhoanId" th:field="*{taiKhoanId}" required>
                            <option value="">Chọn tài khoản</option>
                            <option th:each="t : ${taiKhoans}" th:value="${t.id}" th:text="${t.tenDangNhap + ' — ' + t.hoTen}">
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="maSv">Mã sinh viên<span class="req">*</span></label>
                        <input id="maSv" type="text" th:field="*{maSv}" required maxlength="20">
                    </div>
                    <div class="field">
                        <label for="lop">Lớp hành chính<span class="req">*</span></label>
                        <input id="lop" type="text" th:field="*{lop}" maxlength="30" required>
                        <p class="field-error" th:errors="*{lop}"></p>
                    </div>
                    <div class="field">
                        <label for="khoaHoc">Khóa học<span class="req">*</span></label>
                        <input id="khoaHoc" type="text" th:field="*{khoaHoc}" maxlength="30" required>
                        <p class="field-error" th:errors="*{khoaHoc}"></p>
                    </div>
                </div>
                <div class="actions">
                    <button class="button" type="submit">Lưu</button>
                    <a class="button secondary" th:href="@{/admin/sinh-vien}">Hủy</a>
                </div>
            </form>
        </main>
        <script th:src="@{/js/form.js}" defer></script>
    </body>
</html>
