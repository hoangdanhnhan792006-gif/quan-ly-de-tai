<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Tạo nhóm · Quản lý đề tài</title>
</head>
<body><nav th:replace="~{fragments/dieu-huong :: menu}"></nav><main class="workspace">
<a class="back-link" th:href="@{/sinh-vien/nhom}">← Nhóm của tôi</a>
<h1>Tạo nhóm sinh viên</h1>
<p class="message success" th:if="${thanhCong}" th:text="${thanhCong}"></p>
<p class="message error" th:if="${loi}" th:text="${loi}"></p>
<p class="message warning" th:if="${#lists.isEmpty(cacDot)}">Hiện không có đợt mở đăng ký sinh viên.</p>
<form th:action="@{/sinh-vien/nhom/tao}" th:object="${form}" method="post" class="panel stack">
<div class="message error" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<p class="field-hint">Người tạo nhóm trở thành nhóm trưởng.</p>
<div class="field">
    <label for="dotId">Đợt đăng ký<span class="req">*</span></label><select th:field="*{dotId}" required><option value="">Chọn đợt</option>
    <option th:each="d : ${cacDot}" th:value="${d.id}" th:text="${d.tenDot}"></option></select>
</div>
<div class="form-grid">
    <div class="field">
        <label for="maNhom">Mã nhóm (duy nhất trong đợt)<span class="req">*</span></label><input th:field="*{maNhom}" required maxlength="30" pattern="[A-Za-z0-9_-]{1,30}">
        <p class="field-hint">Tối đa 30 ký tự: chữ, số hoặc dấu gạch.</p>
    </div>
    <div class="field">
        <label for="tenNhom">Tên nhóm<span class="req">*</span></label><input th:field="*{tenNhom}" maxlength="150" required>
        <p class="field-error" th:errors="*{tenNhom}"></p>
    </div>
</div>
<div class="actions">
    <button type="submit" th:disabled="${#lists.isEmpty(cacDot)}">Tạo nhóm</button>
    <a class="button secondary" th:href="@{/sinh-vien/nhom}">Hủy</a>
</div>
</form>
</main><script th:src="@{/js/form.js}" defer></script></body></html>
