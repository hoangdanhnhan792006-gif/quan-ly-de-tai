<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Đăng nhập</title>
</head>
<body>
<main class="container auth-card">
    <a class="back-link" th:href="@{/}">← Trang chủ</a>
    <h1>Đăng nhập</h1>
    <p th:if="${param.passwordChanged}" class="message success">Đã đổi mật khẩu. Vui lòng đăng nhập lại.</p>
    <p th:if="${param.sessionChanged}" class="message error">Tài khoản hoặc quyền truy cập đã thay đổi. Vui lòng đăng nhập lại.</p>
    <p th:if="${param.error}" class="message error">Tên đăng nhập hoặc mật khẩu không đúng.</p>
    <p th:if="${param.logout}" class="message success">Bạn đã đăng xuất.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button" type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
