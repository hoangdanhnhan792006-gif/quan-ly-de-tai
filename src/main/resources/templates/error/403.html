<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head(~{::title})}">
        <title>Không có quyền truy cập · Quản lý đề tài</title>
    </head>
    <body>
        <nav th:replace="~{fragments/dieu-huong :: menu}">
        </nav>
        <main class="workspace">
            <section class="error-page">
                <p class="error-code danger"><span class="sr-only">Lỗi </span>403</p>
                <div class="error-body">
                    <h1>Không có quyền truy cập</h1>
                    <p class="message success" th:if="${thanhCong}" th:text="${thanhCong}">
                    </p>
                    <p>Tài khoản của bạn không được phép thực hiện thao tác này.</p>
                    <p class="muted">Nếu cần quyền này, hãy liên hệ quản trị viên hoặc cán bộ khoa.</p>
                    <div class="actions">
                        <a class="button" th:href="@{/dashboard}">Về bảng điều khiển</a>
                        <a class="button secondary" href="javascript:history.back()">Quay lại</a>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
