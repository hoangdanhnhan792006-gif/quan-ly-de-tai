spring:
  application:
    name: quan-ly-de-tai

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/quan_ly_de_tai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:doan_dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Cau truc 24 bang da duoc kiem thu
    validate-migration-naming: true

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    org.hibernate.SQL: warn

app:
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
