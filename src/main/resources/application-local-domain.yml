# Tên miền thật, chỉ dùng trên máy local. Không bật kèm profile prod.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/quan_ly_de_tai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
server:
  address: 127.0.0.1
  port: 8443
  ssl:
    enabled: true
    key-store: ${LOCAL_SSL_KEY_STORE:file:./.local-https/qldt.nhom4qldt.id.vn.pfx}
    key-store-type: PKCS12
    key-store-password: ${LOCAL_SSL_PASSWORD}
    # PFX chỉ có một khóa riêng; để Tomcat tự chọn alias của win-acme.
  servlet:
    session:
      cookie:
        name: QLDT_LOCAL_DOMAIN_SESSION
        secure: true
        http-only: true
        same-site: lax
app:
  public-url: https://qldt.nhom4qldt.id.vn:8443
